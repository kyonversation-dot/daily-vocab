<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>どちらを選びますかチャレンジ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background: #1a1a2e;
    color: #eee;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 12px 16px 8px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    flex-shrink: 0;
  }

  .title-block h1 { font-size: 1.2rem; color: #ffb4d4; }
  .title-block p { font-size: 0.72rem; color: #aaa; margin-top: 2px; }

  .timer-block {
    text-align: center;
    cursor: pointer;
    user-select: none;
  }
  .timer-num {
    font-size: 2.6rem;
    font-weight: bold;
    color: #ffb4d4;
    line-height: 1;
    transition: color 0.3s;
  }
  .timer-num.danger { color: #ff6b6b; }
  .timer-num.pulse { animation: pulse 0.6s infinite alternate; }
  @keyframes pulse { from { opacity: 1; } to { opacity: 0.4; } }
  .timer-label { font-size: 0.65rem; color: #888; margin-top: 2px; }

  .instruction { font-size: 0.72rem; color: #999; margin-bottom: 8px; flex-shrink: 0; }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
    flex: 1;
    overflow: hidden;
  }

  .vocab-card {
    background: #16213e;
    border: 2px solid #2a2a5a;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 6px 4px;
    transition: background 0.2s, border-color 0.2s;
    text-align: center;
    min-height: 0;
  }
  .vocab-card:hover { border-color: #ffb4d4; }
  .vocab-card.revealed { background: #1a4731; border-color: #4caf7d; }
  .vocab-card.review { border-style: dashed; }
  .review-tag { font-size: 0.5rem; color: #f5a623; margin-bottom: 2px; }

  .word-ja { font-size: 1.05rem; font-weight: bold; color: #eee; line-height: 1.2; }
  .word-reading { font-size: 0.65rem; color: #aaa; margin-top: 2px; }
  .word-meaning { font-size: 0.72rem; color: #a8e6c1; margin-top: 5px; display: none; line-height: 1.3; }
  .vocab-card.revealed .word-meaning { display: block; }

  footer {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 8px;
    flex-shrink: 0;
  }

  button {
    padding: 8px 22px;
    border-radius: 20px;
    border: none;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
    font-weight: bold;
  }
  .btn-reveal { background: #c0436a; color: white; }
  .btn-reveal:hover { background: #e05580; }
  .btn-reset { background: #2a2a5a; color: #ccc; border: 1px solid #444; }
  .btn-reset:hover { background: #3a3a7a; }

  .note { text-align: center; font-size: 0.62rem; color: #666; margin-top: 4px; flex-shrink: 0; }

</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>📖 どちらを選びますかチャレンジ</h1>
    <p>マヤの言葉れんしゅう ｜ カードをタップして意味を確認！</p>
  </div>
  <div class="timer-block" onclick="toggleTimer()">
    <div class="timer-num" id="timerNum">60</div>
    <div class="timer-label" id="timerLabel">▶ タップしてスタート</div>
  </div>
</header>

<div class="instruction">💡 各カードをクリックすると意味が出るよ。タイマーが終わる前に全部確認できるかな？（黄色い点線＝復習の言葉）</div>

<div class="grid" id="grid"></div>

<footer>
  <button class="btn-reveal" onclick="revealAll()">全部見る</button>
  <button class="btn-reset" onclick="goBack()">もう一度</button>
</footer>
<div class="note">緑 = 確認済み</div>

<script>
const words = [
  {
    "ja": "原爆",
    "reading": "げんばく",
    "meaning": "<ruby>原子<rt>げんし</rt></ruby><ruby>爆弾<rt>ばくだん</rt></ruby>のこと",
    "review": false
  },
  {
    "ja": "原子爆弾",
    "reading": "げんしばくだん",
    "meaning": "<ruby>戦争<rt>せんそう</rt></ruby>のときに<ruby>使<rt>つか</rt></ruby>われた、とても<ruby>大<rt>おお</rt></ruby>きな<ruby>爆弾<rt>ばくだん</rt></ruby>",
    "review": false
  },
  {
    "ja": "戦争",
    "reading": "せんそう",
    "meaning": "<ruby>国<rt>くに</rt></ruby>と<ruby>国<rt>くに</rt></ruby>が<ruby>兵器<rt>へいき</rt></ruby>で<ruby>戦<rt>たたか</rt></ruby>うこと",
    "review": false
  },
  {
    "ja": "広島",
    "reading": "ひろしま",
    "meaning": "<ruby>中国<rt>ちゅうごく</rt></ruby><ruby>地方<rt>ちほう</rt></ruby>にある<ruby>県<rt>けん</rt></ruby>と<ruby>市<rt>し</rt></ruby>。<ruby>世界<rt>せかい</rt></ruby>で<ruby>初<rt>はじ</rt></ruby>めて<ruby>原子爆弾<rt>げんしばくだん</rt></ruby>が<ruby>落<rt>お</rt></ruby>とされた",
    "review": false
  },
  {
    "ja": "長崎",
    "reading": "ながさき",
    "meaning": "<ruby>九州<rt>きゅうしゅう</rt></ruby>にある<ruby>県<rt>けん</rt></ruby>と<ruby>市<rt>し</rt></ruby>。<ruby>広島<rt>ひろしま</rt></ruby>のあとに<ruby>原子爆弾<rt>げんしばくだん</rt></ruby>が<ruby>落<rt>お</rt></ruby>とされた",
    "review": false
  },
  {
    "ja": "構内",
    "reading": "こうない",
    "meaning": "駅や学校などの、<ruby>建物<rt>たてもの</rt></ruby>や<ruby>敷地<rt>しきち</rt></ruby>の中",
    "review": false
  },
  {
    "ja": "心当たり",
    "reading": "こころあたり",
    "meaning": "「もしかしてあれかな」と思い当たること",
    "review": false
  },
  {
    "ja": "遺族",
    "reading": "いぞく",
    "meaning": "なくなった人の、あとに<ruby>残<rt>のこ</rt></ruby>された家族",
    "review": false
  },
  {
    "ja": "事実",
    "reading": "じじつ",
    "meaning": "本当にあったこと（⇔<ruby>感想<rt>かんそう</rt></ruby>・思ったこと）",
    "review": true
  },
  {
    "ja": "減る",
    "reading": "へる",
    "meaning": "<ruby>数<rt>かず</rt></ruby>や<ruby>量<rt>りょう</rt></ruby>が<ruby>少<rt>すく</rt></ruby>なくなること",
    "review": true
  },
  {
    "ja": "司会",
    "reading": "しかい",
    "meaning": "<ruby>話<rt>はな</rt></ruby>し<ruby>合<rt>あ</rt></ruby>いを<ruby>進<rt>すす</rt></ruby>める<ruby>役<rt>やく</rt></ruby>の<ruby>人<rt>ひと</rt></ruby>",
    "review": true
  },
  {
    "ja": "意図",
    "reading": "いと",
    "meaning": "そうしようと思っている考え・ねらい",
    "review": true
  }
];

const grid = document.getElementById('grid');
words.forEach(w => {
  const card = document.createElement('div');
  card.className = 'vocab-card' + (w.review ? ' review' : '');
  card.innerHTML = `
    ${w.review ? `<div class="review-tag">🔁 ふくしゅう</div>` : ''}
    <div class="word-ja">${w.ja}</div>
    ${w.reading ? `<div class="word-reading">${w.reading}</div>` : ''}
    <div class="word-meaning">${w.meaning}</div>
  `;
  card.onclick = () => card.classList.toggle('revealed');
  grid.appendChild(card);
});

let seconds = 60, running = false, timer = null;
const timerNum = document.getElementById('timerNum');
const timerLabel = document.getElementById('timerLabel');

function updateDisplay() {
  timerNum.textContent = seconds;
  const danger = seconds <= 10;
  timerNum.classList.toggle('danger', danger);
  timerNum.classList.toggle('pulse', danger && running);
  if (seconds <= 0) { timerNum.textContent = '⏰'; timerLabel.textContent = "TIME'S UP!"; }
}

function toggleTimer() {
  if (seconds <= 0) { resetTimer(); return; }
  if (running) {
    clearInterval(timer); running = false;
    timerLabel.textContent = '▶ タップしてスタート';
    timerNum.classList.remove('pulse');
  } else {
    running = true;
    timerLabel.textContent = '⏸ タップして一時停止';
    timer = setInterval(() => {
      seconds--;
      updateDisplay();
      if (seconds <= 0) { clearInterval(timer); running = false; }
    }, 1000);
  }
}

function resetTimer() {
  clearInterval(timer); running = false; seconds = 60;
  timerNum.classList.remove('danger', 'pulse');
  timerLabel.textContent = '▶ タップしてスタート';
  updateDisplay();
}

function revealAll() {
  document.querySelectorAll('.vocab-card').forEach(c => c.classList.add('revealed'));
}

function goBack() {
  document.querySelectorAll('.vocab-card.revealed').forEach(c => c.classList.remove('revealed'));
  resetTimer();
}

updateDisplay();
</script>
</body>
</html>
