  button.choice.wrong { background: #4a1a26; border-color: #e05580; color: #ffc0d0; }
  button.choice:disabled { cursor: default; opacity: 0.85; }

  .feedback { font-size: 0.9rem; min-height: 1.4em; text-align: center; line-height: 1.6; }
  .feedback .ok { color: #a8e6c1; }
  .feedback .ng { color: #ffb4b4; }
  .feedback .mean { display: block; color: #aaa; font-size: 0.78rem; margin-top: 4px; }

  .result { text-align: center; }
  .result h2 { color: #ffb4d4; font-size: 1.5rem; margin-bottom: 10px; }
  .result .big { font-size: 2.6rem; font-weight: bold; color: #a8e6c1; }
  .missed {
    margin-top: 16px; text-align: left; background: #16213e; border: 1px solid #2a2a5a;
    border-radius: 12px; padding: 14px 16px; max-width: 460px; font-size: 0.85rem; line-height: 1.9;

  .missed h3 { font-size: 0.8rem; color: #f5a623; margin-bottom: 6px; }
  .missed b { color: #fff; font-size: 1.05rem; }
  .missed span { color: #a8e6c1; }

  footer { display: flex; justify-content: center; gap: 12px; margin-top: 14px; flex-shrink: 0; }
  button.act {
    padding: 10px 22px; border-radius: 20px; border: none;
    font-size: 0.85rem; font-family: inherit; cursor: pointer; font-weight: bold;
  }
  .btn-again { background: #c0436a; color: white; }
  .btn-again:hover { background: #e05580; }
  a.back { color: #888; font-size: 0.8rem; text-decoration: none; align-self: center; padding: 8px; }
  .note { text-align: center; font-size: 0.62rem; color: #666; margin-top: 6px; flex-shrink: 0; }

    "meaning": "<ruby>中国<rt>ちゅうごく</rt></ruby><ruby>地方<rt>ちほう</rt></ruby>にある<ruby>県<rt>けん</rt></ruby>と<ruby>市<rt>し</rt></ruby>。<ruby>世界<rt>せかい</rt></ruby>で<ruby>初<rt>はじ</rt></ruby>めて<ruby>原子爆弾<rt>げんしばくだん</rt></ruby>が<ruby>落<rt>お</rt></ruby>とされた"
  },
  {
    "ja": "長崎",
    "reading": "ながさき",
    "meaning": "<ruby>九州<rt>きゅうしゅう</rt></ruby>にある<ruby>県<rt>けん</rt></ruby>と<ruby>市<rt>し</rt></ruby>。<ruby>広島<rt>ひろしま</rt></ruby>のあとに<ruby>原子爆弾<rt>げんしばくだん</rt></ruby>が<ruby>落<rt>お</rt></ruby>とされた"
  },
  {
    "ja": "構内",
    "reading": "こうない",
    "meaning": "駅や学校などの、<ruby>建物<rt>たてもの</rt></ruby>や<ruby>敷地<rt>しきち</rt></ruby>の中"
  },
  {
    "ja": "心当たり",
    "reading": "こころあたり",
    "meaning": "「もしかしてあれかな」と思い当たること"

  {

    "reading": "いぞく",
    "meaning": "なくなった人の、あとに<ruby>残<rt>のこ</rt></ruby>された家族"
  },
  {
    "ja": "県庁所在地",
    "reading": "けんちょうしょざいち",
    "meaning": "その<ruby>県<rt>けん</rt></ruby>の<ruby>中心<rt>ちゅうしん</rt></ruby>になる<ruby>市<rt>し</rt></ruby>や<ruby>町<rt>まち</rt></ruby>"
  },
  {
    "ja": "平和学習",
    "reading": "へいわがくしゅう",
    "meaning": "<ruby>戦争<rt>せんそう</rt></ruby>のことを<ruby>学<rt>まな</rt></ruby>んで、おなじことが<ruby>起<rt>お</rt></ruby>きないように<ruby>考<rt>かんが</rt></ruby>える<ruby>勉強<rt>べんきょう</rt></ruby>"
  },
  {
    "ja": "せがむ",
    "reading": "せがむ",
    "meaning": "「ねえ、いこうよ」と<ruby>何回<rt>なんかい</rt></ruby>もおねがいすること"
  },
  {

    "reading": "じゅく",
    "meaning": "<ruby>学校<rt>がっこう</rt></ruby>のあとに<ruby>勉強<rt>べんきょう</rt></ruby>をならいに<ruby>行<rt>い</rt></ruby>くところ"
  },
  {
    "ja": "原爆供養塔納骨名簿",
    "reading": "げんばくくようとうのうこつめいぼ",
    "meaning": "<ruby>原爆<rt>げんばく</rt></ruby>でなくなった人のおほねをおさめた<ruby>場所<rt>ばしょ</rt></ruby>の、<ruby>名前<rt>なまえ</rt></ruby>の<ruby>一覧<rt>いちらん</rt></ruby>"
  },
  {
    "ja": "資料館",
    "reading": "しりょうかん",
    "meaning": "しりょうを集めて見せる<ruby>建物<rt>たてもの</rt></ruby>"
  },
  {
    "ja": "陳列",
    "reading": "ちんれつ",
    "meaning": "人に見せるためにならべておくこと"
  },
  {
    "ja": "展示",
    "reading": "てんじ",
    "meaning": "たくさんの人に見せるためにならべること"
  }
];
const N_Q = Math.min(12, POOL.length);

const shuffle = (a) => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
// ルビを外した素の文字（答えが混じっていないか調べるため）
const plain = (s) => s.replace(/<rt>.*?<\/rt>/g, '').replace(/<[^>]+>/g, '');

// 答えの語そのものは伏せる。
//  例）「杉板 ／ すぎの木の板。「杉板を削って…」」→「すぎの木の板。「◯◯を削って…」」
//  これをしないと、意味の中に答えが書いてあって、読まなくても当たってしまう。
function maskWord(html, ja) {
  let out = html.replace(new RegExp('<ruby>' + escRe(ja) + '<rt>.*?</rt></ruby>', 'g'), '◯◯');
  // タグの外に素で残っている分も伏せる（タグの中は壊さない）
  return out.split(/(<[^>]+>)/).map(seg => seg.startsWith('<') ? seg : seg.split(ja).join('◯◯')).join('');
}

// 選択肢に出す「いみ」。見出し（語そのもの）＋「／」の形は、後ろ半分だけ使う。
function defHtml(w) {
  let m = w.meaning || '';
  const parts = m.split('／');
  if (parts.length > 1 && plain(parts[0]).includes(w.ja)) m = parts.slice(1).join('／');
  m = maskWord(m, w.ja).trim();
  return m || maskWord(w.meaning || '', w.ja);
}

const ITEMS = POOL.map(w => ({ ...w, def: defHtml(w) })).filter(w => plain(w.def).trim().length > 0);

// 選択肢は「意味がちがう語」から2つ。同じ意味文が並ぶと正解が2つになるので除く。
function makeChoices(w) {
  const others = ITEMS.filter(x => plain(x.def) !== plain(w.def));
  const near = shuffle(others.filter(x => Math.abs(plain(x.def).length - plain(w.def).length) <= 12));
  const rest = shuffle(others);
  const picked = [];
  for (const cand of [...near, ...rest]) {
    if (picked.length >= 2) break;
    if (picked.some(p => plain(p.def) === plain(cand.def))) continue;
    picked.push(cand);
  }
  return shuffle([w, ...picked]);
}

let quiz = [], idx = 0, score = 0, missed = [];

function start() {
  quiz = shuffle(ITEMS).slice(0, Math.min(N_Q, ITEMS.length));
  idx = 0; score = 0; missed = [];
  document.getElementById('footer').innerHTML = '';
  render();
}

function render() {
  const w = quiz[idx];
  document.getElementById('count').textContent = `${idx + 1} / ${quiz.length}`;
  document.getElementById('score').textContent = `⭕ ${score}`;
  const choices = makeChoices(w);
  document.getElementById('stage').innerHTML = `
    <div class="qcard">
      <div class="qword">${w.ja}</div>
      ${w.reading ? `<div class="qreading">${w.reading}</div>` : ''}
      <div class="qhint">どんな いみ？</div>
    </div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
  `;
  const box = document.getElementById('choices');
  choices.forEach(c => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = c.def;
    b.onclick = () => answer(b, c, w);
    box.appendChild(b);
  });
}

function answer(btn, chosen, w) {
  const buttons = [...document.querySelectorAll('button.choice')];
  buttons.forEach(b => { b.disabled = true; if (plain(b.innerHTML) === plain(w.def)) b.classList.add('correct'); });
  const fb = document.getElementById('feedback');
  if (plain(chosen.def) === plain(w.def)) {
    score++;
    fb.innerHTML = `<span class="ok">⭕ せいかい！</span>`;
  } else {
    btn.classList.add('wrong');
    missed.push(w);
    fb.innerHTML = `<span class="ng">✕ 「${w.ja}」は こっち</span><span class="mean">${w.def}</span>`;
  }
  document.getElementById('score').textContent = `⭕ ${score}`;
  setTimeout(next, plain(chosen.def) === plain(w.def) ? 900 : 2400);
}

function next() {
  idx++;
  if (idx >= quiz.length) { finish(); return; }
  render();
}

function finish() {
  const missedHtml = missed.length
    ? `<div class="missed"><h3>もう一回みておく言葉</h3>${missed.map(w => `<div><b>${w.ja}</b> … <span>${w.def}</span></div>`).join('')}</div>`
    : `<div class="missed"><h3>ぜんぶ わかった！</h3><div>すごい ✨</div></div>`;
  document.getElementById('stage').innerHTML = `
    <div class="result">
      <h2>おつかれさま！</h2>
      <div class="big">${score} / ${quiz.length}</div>
      ${missedHtml}
    </div>
  `;
  document.getElementById('count').textContent = `${quiz.length} / ${quiz.length}`;
  document.getElementById('footer').innerHTML = `
    <button class="act btn-again" onclick="start()">もう1回（ちがう問題）</button>
    <a class="back" href="./">← もどる</a>
  `;
}

start();
