<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>星の花の例文</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 12px 16px 16px;
  }

  header { flex-shrink: 0; margin-bottom: 10px; }
  .title-block h1 { font-size: 1.2rem; color: #ffb4d4; }
  .title-block p { font-size: 0.72rem; color: #aaa; margin-top: 2px; }

  .instruction { font-size: 0.72rem; color: #999; margin-bottom: 10px; flex-shrink: 0; }

  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
  }

  .sentence {
    background: #16213e;
    border: 2px solid #2a2a5a;
    border-radius: 12px;
    padding: 20px 18px;
    font-size: 1.05rem;
    line-height: 2.0;
  }
  .blank {
    display: inline-block;
    min-width: 5em;
    border-bottom: 3px solid #f5a623;
    color: #f5a623;
    font-weight: bold;
    text-align: center;
    padding: 0 4px;
  }
  .blank.filled { border-bottom-color: #4caf7d; color: #7fe3ac; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .choice {
    background: #16213e;
    border: 2px solid #2a2a5a;
    border-radius: 10px;
    padding: 14px 10px;
    font-size: 1.0rem;
    font-family: inherit;
    color: #eee;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, opacity 0.15s;
    text-align: center;
    font-weight: bold;
  }
  .choice:hover:not(:disabled) { border-color: #ffb4d4; }
  .choice.correct { border-color: #4caf7d; background: #1a4731; color: #7fe3ac; }
  .choice.wrong { border-color: #ff6b6b; background: #3a1a1a; opacity: 0.55; }
  .choice:disabled { cursor: default; }

  .answerbox {
    display: none;
    background: #1a2f24;
    border: 1px solid #2f6b4c;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.8rem;
    line-height: 1.7;
  }
  .answerbox.show { display: block; }
  .answerbox .ja { font-size: 1.0rem; font-weight: bold; color: #7fe3ac; }
  .answerbox .reading { font-size: 0.72rem; color: #aaa; margin-top: 2px; }
  .answerbox .meaning { color: #cfe9db; margin-top: 6px; }

  .hint { color: #f5a623; font-size: 0.78rem; text-align: center; min-height: 1.2em; }

  footer { display: flex; justify-content: center; gap: 12px; margin-top: 14px; flex-shrink: 0; }

  button.nav {
    padding: 10px 26px;
    border-radius: 20px;
    border: none;
    font-size: 0.9rem;
    font-family: inherit;
    cursor: pointer;
    font-weight: bold;
  }
  .btn-primary { background: #c0436a; color: white; }
  .btn-primary:hover { background: #e05580; }
  .btn-secondary { background: #2a2a5a; color: #ccc; border: 1px solid #444; }
  .btn-secondary:hover { background: #3a3a7a; }

  .progress { font-size: 0.72rem; color: #888; text-align: center; margin-top: 10px; flex-shrink: 0; }

  .complete-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    z-index: 10;
    padding: 24px;
    text-align: center;
  }
  .complete-overlay.show { display: flex; }
  .complete-overlay h2 { font-size: 1.6rem; color: #ffb4d4; }
  .complete-overlay p { color: #aaa; font-size: 0.85rem; line-height: 1.7; }
  .complete-overlay a { color: #888; font-size: 0.8rem; text-decoration: none; }

</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>✏️ 星の花の例文</h1>
    <p>ひなののことばれんしゅう ｜ 文の中で使ってみよう</p>
  </div>
</header>

<div class="instruction">💡 ＿＿＿ に入る言葉をえらんでね。まちがえても大丈夫。答えを見て、意味をたしかめよう。</div>

<div class="stage">
  <div class="sentence" id="sentence"></div>
  <div class="choices" id="choices"></div>
  <div class="hint" id="hint"></div>
  <div class="answerbox" id="answerbox"></div>
</div>

<div class="progress" id="progress"></div>

<footer>
  <button class="nav btn-primary" id="nextBtn" onclick="next()" style="display:none">つぎへ →</button>
</footer>

<div class="complete-overlay" id="overlay">
  <h2>🎉 今日のぶん、ぜんぶ見たよ！</h2>
  <p id="doneMsg"></p>
  <button class="nav btn-primary" onclick="restart()">もう一度やる</button>
  <a href="./">← 今日のゲームにもどる</a>
</div>

<script>
const allWords = ([
  {
    "ja": "対岸",
    "reading": "たいがん",
    "meaning": "川や海の<ruby>向<rt>む</rt></ruby>こう<ruby>側<rt>がわ</rt></ruby>の<ruby>岸<rt>きし</rt></ruby>",
    "example": "家の前の渓流には飛び石が＿＿＿に続き、大雨の日は渡れません。",
    "review": true
  },
  {
    "ja": "疎開",
    "reading": "そかい",
    "meaning": "<ruby>空襲<rt>くうしゅう</rt></ruby>からのがれるため、<ruby>都会<rt>とかい</rt></ruby>から<ruby>地方<rt>ちほう</rt></ruby>へ引っこすこと",
    "example": "あまり空襲がひどくなってきたので、母は＿＿＿しようと言いだしました。",
    "review": true
  },
  {
    "ja": "場面",
    "reading": "ばめん",
    "meaning": "<ruby>物語<rt>ものがたり</rt></ruby>の中の、一つ一つの<ruby>場所<rt>ばしょ</rt></ruby>や時",
    "example": "心に残った＿＿＿を選んで、朗読しよう。",
    "review": true
  },
  {
    "ja": "朗読",
    "reading": "ろうどく",
    "meaning": "気持ちが<ruby>伝<rt>つた</rt></ruby>わるように、声に出して読むこと",
    "example": "心に残った場面を＿＿＿し、感想を伝え合おう。",
    "review": true
  },
  {
    "ja": "とまどう",
    "reading": "とまどう",
    "meaning": "<ruby>とまどう<rt>とまどう</rt></ruby> ／ どうしていいか分からなくなる",
    "example": "夏実は一瞬＿＿＿たような顔でこちらを見た。",
    "review": true
  },
  {
    "ja": "表記",
    "reading": "ひょうき",
    "meaning": "文字での<ruby>書<rt>か</rt></ruby>き<ruby>表<rt>あらわ</rt></ruby>し方。「片仮名表記」",
    "example": "人の名前や地名を片仮名で書く——この＿＿＿にはどんな効果があるだろう。",
    "review": true
  },
  {
    "ja": "印象",
    "reading": "いんしょう",
    "meaning": "読んだり見たりして、心に<ruby>残<rt>のこ</rt></ruby>る感じ",
    "example": "「一本道」と書くのと「白い乾いた一本道」と書くのでは、受ける＿＿＿がちがう。",
    "review": true
  },
  {
    "ja": "終戦",
    "reading": "しゅうせん",
    "meaning": "<ruby>戦争<rt>せんそう</rt></ruby>が<ruby>終<rt>お</rt></ruby>わること（1945年8月15日）",
    "example": "一九四五年八月十五日に戦争は終わりました。これを＿＿＿という。",
    "review": true
  },
  {
    "ja": "にじむ",
    "reading": "にじむ",
    "meaning": "<ruby>にじむ<rt>にじむ</rt></ruby> ／ じわっとしみ出てくる",
    "example": "涙が＿＿＿できたのは、あんまり笑いすぎたせいだ。",
    "review": true
  },
  {
    "ja": "語り手",
    "reading": "かたりて",
    "meaning": "<ruby>物語<rt>ものがたり</rt></ruby>を<ruby>語<rt>かた</rt></ruby>っている人。この作品では「僕」",
    "example": "この物語の＿＿＿は、大人になった「僕」である。",
    "review": true
  },
  {
    "ja": "情景描写",
    "reading": "じょうけいびょうしゃ",
    "meaning": "<ruby>情景描写<rt>じょうけいびょうしゃ</rt></ruby> ／ 人物の心情と<ruby>響<rt>ひび</rt></ruby>き合うように<ruby>描<rt>えが</rt></ruby>かれた、風景や場面の描写",
    "example": "銀木犀の＿＿＿を、冒頭と結末で比べてみよう。",
    "review": true
  },
  {
    "ja": "春先",
    "reading": "はるさき",
    "meaning": "<ruby>春先<rt>はるさき</rt></ruby> ／ 春のはじめのころ",
    "example": "けど＿＿＿は、葉っぱが落ちて案外厄介なんだよ、掃除がさ。",
    "review": true
  }
]).filter(w => w.example);
const BLANK = '＿＿＿';

let queue = [], idx = 0, answered = false, tries = 0;

function shuffleArr(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function esc(t) {
  return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 例文の空欄マーカー。熟語は ＿＿＿、漢字1字は ＿ を使っている。
function blankMark(ex) { return ex.includes(BLANK) ? BLANK : '＿'; }

function start() {
  queue = shuffleArr(allWords);
  idx = 0;
  render();
}

function render() {
  answered = false; tries = 0;
  const w = queue[idx];
  const mark = blankMark(w.example);
  const parts = esc(w.example).split(mark);
  document.getElementById('sentence').innerHTML =
    parts[0] + '<span class="blank" id="blank">?</span>' + parts.slice(1).join(mark);

  // まちがいの選択肢は、今日の言葉の中から取る（似た言葉の区別の練習になる）
  const others = shuffleArr(allWords.filter(x => x.ja !== w.ja)).slice(0, 3);
  const opts = shuffleArr([w, ...others]);

  const box = document.getElementById('choices');
  box.innerHTML = '';
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = o.ja;
    b.onclick = () => pick(b, o.ja, w);
    box.appendChild(b);
  });

  document.getElementById('hint').textContent = '';
  document.getElementById('answerbox').className = 'answerbox';
  document.getElementById('answerbox').innerHTML = '';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('progress').textContent = `${idx + 1} / ${queue.length}`;
}

function pick(btn, chosen, w) {
  if (answered) return;
  if (chosen === w.ja) {
    btn.classList.add('correct');
    reveal(w);
  } else {
    btn.classList.add('wrong');
    btn.disabled = true;
    tries++;
    if (tries >= 2) {
      document.getElementById('hint').textContent = 'こっちだよ 👇';
      const right = [...document.querySelectorAll('.choice')].find(b => b.textContent === w.ja);
      if (right) right.classList.add('correct');
      reveal(w);
    } else {
      document.getElementById('hint').textContent = 'うーん、もう一回さがしてみよう';
    }
  }
}

function reveal(w) {
  answered = true;
  document.querySelectorAll('.choice').forEach(b => b.disabled = true);
  const blank = document.getElementById('blank');
  blank.textContent = w.ja;
  blank.classList.add('filled');
  const box = document.getElementById('answerbox');
  box.innerHTML =
    `<div class="ja">${esc(w.ja)}</div>` +
    (w.reading ? `<div class="reading">${esc(w.reading)}</div>` : '') +
    `<div class="meaning">${w.meaning}</div>`;
  box.classList.add('show');
  document.getElementById('nextBtn').style.display = 'inline-block';
}

function next() {
  idx++;
  if (idx >= queue.length) {
    document.getElementById('doneMsg').textContent =
      `${queue.length} この言葉を、文の中で使ってみたよ。`;
    document.getElementById('overlay').classList.add('show');
    return;
  }
  render();
}

function restart() {
  document.getElementById('overlay').classList.remove('show');
  start();
}

if (allWords.length === 0) {
  document.getElementById('sentence').textContent = '今日は例文のある言葉がありません。';
  document.getElementById('progress').textContent = '';
} else {
  start();
}
</script>
</body>
</html>
