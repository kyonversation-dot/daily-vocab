<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>星の花の例文</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 12px 16px 16px;
  }

  header { flex-shrink: 0; margin-bottom: 10px; }
  .title-block h1 { font-size: 1.2rem; color: #ffb4d4; }
  .title-block p { font-size: 0.72rem; color: #aaa; margin-top: 2px; }

  .instruction { font-size: 0.72rem; color: #999; margin-bottom: 10px; flex-shrink: 0; }

  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
  }

  .sentence {
    background: #16213e;
    border: 2px solid #2a2a5a;
    border-radius: 12px;
    padding: 20px 18px;
    font-size: 1.05rem;
    line-height: 2.0;
  }
  .blank {
    display: inline-block;
    min-width: 5em;
    border-bottom: 3px solid #f5a623;
    color: #f5a623;
    font-weight: bold;
    text-align: center;
    padding: 0 4px;
  }
  .blank.filled { border-bottom-color: #4caf7d; color: #7fe3ac; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .choice {
    background: #16213e;
    border: 2px solid #2a2a5a;
    border-radius: 10px;
    padding: 14px 10px;
    font-size: 1.0rem;
    font-family: inherit;
    color: #eee;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, opacity 0.15s;
    text-align: center;
    font-weight: bold;
  }
  .choice:hover:not(:disabled) { border-color: #ffb4d4; }
  .choice.correct { border-color: #4caf7d; background: #1a4731; color: #7fe3ac; }
  .choice.wrong { border-color: #ff6b6b; background: #3a1a1a; opacity: 0.55; }
  .choice:disabled { cursor: default; }

  .answerbox {
    display: none;
    background: #1a2f24;
    border: 1px solid #2f6b4c;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.8rem;
    line-height: 1.7;
  }
  .answerbox.show { display: block; }
  .answerbox .ja { font-size: 1.0rem; font-weight: bold; color: #7fe3ac; }
  .answerbox .reading { font-size: 0.72rem; color: #aaa; margin-top: 2px; }
  .answerbox .meaning { color: #cfe9db; margin-top: 6px; }

  .hint { color: #f5a623; font-size: 0.78rem; text-align: center; min-height: 1.2em; }

  footer { display: flex; justify-content: center; gap: 12px; margin-top: 14px; flex-shrink: 0; }

  button.nav {
    padding: 10px 26px;
    border-radius: 20px;
    border: none;
    font-size: 0.9rem;
    font-family: inherit;
    cursor: pointer;
    font-weight: bold;
  }
  .btn-primary { background: #c0436a; color: white; }
  .btn-primary:hover { background: #e05580; }
  .btn-secondary { background: #2a2a5a; color: #ccc; border: 1px solid #444; }
  .btn-secondary:hover { background: #3a3a7a; }

  .progress { font-size: 0.72rem; color: #888; text-align: center; margin-top: 10px; flex-shrink: 0; }

  .complete-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    z-index: 10;
    padding: 24px;
    text-align: center;
  }
  .complete-overlay.show { display: flex; }
  .complete-overlay h2 { font-size: 1.6rem; color: #ffb4d4; }
  .complete-overlay p { color: #aaa; font-size: 0.85rem; line-height: 1.7; }
  .complete-overlay a { color: #888; font-size: 0.8rem; text-decoration: none; }

</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>✏️ 星の花の例文</h1>
    <p>ひなののことばれんしゅう ｜ 文の中で使ってみよう</p>
  </div>
</header>

<div class="instruction">💡 ＿＿＿ に入る言葉をえらんでね。まちがえても大丈夫。答えを見て、意味をたしかめよう。</div>

<div class="stage">
  <div class="sentence" id="sentence"></div>
  <div class="choices" id="choices"></div>
  <div class="hint" id="hint"></div>
  <div class="answerbox" id="answerbox"></div>
</div>

<div class="progress" id="progress"></div>

<footer>
  <button class="nav btn-primary" id="nextBtn" onclick="next()" style="display:none">つぎへ →</button>
</footer>

<div class="complete-overlay" id="overlay">
  <h2>🎉 今日のぶん、ぜんぶ見たよ！</h2>
  <p id="doneMsg"></p>
  <button class="nav btn-primary" onclick="restart()">もう一度やる</button>
  <a href="./">← 今日のゲームにもどる</a>
</div>

<script>
const allWords = ([
  {
    "ja": "一文",
    "reading": "いちぶん",
    "meaning": "「。」で終わる、ひとつの文。「この一文だけで<ruby>段落<rt>だんらく</rt></ruby>になっている」",
    "example": "「母の着物はなくなりました。」——この＿＿＿だけで、一つの段落になっている。",
    "review": true
  },
  {
    "ja": "伝え合う",
    "reading": "つたえあう",
    "meaning": "おたがいに自分の考えを言って、<ruby>聞<rt>き</rt></ruby>き合うこと",
    "example": "心に残った場面を朗読し、感想を＿＿＿。",
    "review": true
  },
  {
    "ja": "田植え",
    "reading": "たうえ",
    "meaning": "<ruby>稲<rt>いね</rt></ruby>のなえを田んぼに<ruby>植<rt>う</rt></ruby>える<ruby>仕事<rt>しごと</rt></ruby>",
    "example": "母は生まれて初めて＿＿＿を手伝い、昼のご飯を僕たちに残して持って帰ってきました。",
    "review": true
  },
  {
    "ja": "飛び石",
    "reading": "とびいし",
    "meaning": "川などにならべた、とびながら<ruby>渡<rt>わた</rt></ruby>る石",
    "example": "家の前の渓流には＿＿＿が対岸に続き、大雨の日は渡れません。",
    "review": true
  },
  {
    "ja": "澄む",
    "reading": "すむ",
    "meaning": "にごりがなく、きれいに<ruby>透<rt>す</rt></ruby>きとおる。「空が青く澄む」",
    "example": "川の水が＿＿＿と、底の石まで見える。",
    "review": true
  },
  {
    "ja": "留守番",
    "reading": "るすばん",
    "meaning": "家に<ruby>残<rt>のこ</rt></ruby>って家を<ruby>守<rt>まも</rt></ruby>ること",
    "example": "祖母と四歳の妹に＿＿＿をたのんで、田舎へ出かけました。",
    "review": true
  },
  {
    "ja": "桃源郷",
    "reading": "とうげんきょう",
    "meaning": "<ruby>俗世間<rt>ぞくせけん</rt></ruby>をはなれた、すばらしい<ruby>別世界<rt>べっせかい</rt></ruby>。地上の楽園",
    "example": "生まれて初めて見る、それは＿＿＿でした。",
    "review": true
  },
  {
    "ja": "息をひきとる",
    "reading": "いきをひきとる",
    "meaning": "<ruby>死<rt>し</rt></ruby>ぬ、のしずかな言い方",
    "example": "母と僕に見守られて、弟は静かに＿＿＿。",
    "review": true
  },
  {
    "ja": "描写",
    "reading": "びょうしゃ",
    "meaning": "様子や<ruby>心情<rt>しんじょう</rt></ruby>を、<ruby>読<rt>よ</rt></ruby>み<ruby>手<rt>て</rt></ruby>が<ruby>想像<rt>そうぞう</rt></ruby>できるように<ruby>描<rt>えが</rt></ruby>くこと（この単元のキーワード）",
    "example": "心情は、行動や風景の＿＿＿にたくして表されることが多い。",
    "review": true
  },
  {
    "ja": "段落",
    "reading": "だんらく",
    "meaning": "文章のまとまり。<ruby>一字下<rt>いちじさ</rt></ruby>げて<ruby>始<rt>はじ</rt></ruby>まる",
    "example": "「母の着物はなくなりました。」は、一文だけで一つの＿＿＿になっている。",
    "review": true
  },
  {
    "ja": "変化",
    "reading": "へんか",
    "meaning": "前とちがうようすに<ruby>変<rt>か</rt></ruby>わること。「<ruby>心情<rt>しんじょう</rt></ruby>の変化」",
    "example": "物語を読むときは、登場人物の心の＿＿＿を追いかける。",
    "review": true
  },
  {
    "ja": "情景",
    "reading": "じょうけい",
    "meaning": "<ruby>目<rt>め</rt></ruby>にうかんでくる<ruby>場面<rt>ばめん</rt></ruby>のようす",
    "example": "「白い乾いた一本道」は、その場の＿＿＿が目に浮かぶ言葉だ。",
    "review": true
  }
]).filter(w => w.example);
const BLANK = '＿＿＿';

let queue = [], idx = 0, answered = false, tries = 0;

function shuffleArr(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function esc(t) {
  return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 例文の空欄マーカー。熟語は ＿＿＿、漢字1字は ＿ を使っている。
function blankMark(ex) { return ex.includes(BLANK) ? BLANK : '＿'; }

function start() {
  queue = shuffleArr(allWords);
  idx = 0;
  render();
}

function render() {
  answered = false; tries = 0;
  const w = queue[idx];
  const mark = blankMark(w.example);
  const parts = esc(w.example).split(mark);
  document.getElementById('sentence').innerHTML =
    parts[0] + '<span class="blank" id="blank">?</span>' + parts.slice(1).join(mark);

  // まちがいの選択肢は、今日の言葉の中から取る（似た言葉の区別の練習になる）
  const others = shuffleArr(allWords.filter(x => x.ja !== w.ja)).slice(0, 3);
  const opts = shuffleArr([w, ...others]);

  const box = document.getElementById('choices');
  box.innerHTML = '';
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = o.ja;
    b.onclick = () => pick(b, o.ja, w);
    box.appendChild(b);
  });

  document.getElementById('hint').textContent = '';
  document.getElementById('answerbox').className = 'answerbox';
  document.getElementById('answerbox').innerHTML = '';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('progress').textContent = `${idx + 1} / ${queue.length}`;
}

function pick(btn, chosen, w) {
  if (answered) return;
  if (chosen === w.ja) {
    btn.classList.add('correct');
    reveal(w);
  } else {
    btn.classList.add('wrong');
    btn.disabled = true;
    tries++;
    if (tries >= 2) {
      document.getElementById('hint').textContent = 'こっちだよ 👇';
      const right = [...document.querySelectorAll('.choice')].find(b => b.textContent === w.ja);
      if (right) right.classList.add('correct');
      reveal(w);
    } else {
      document.getElementById('hint').textContent = 'うーん、もう一回さがしてみよう';
    }
  }
}

function reveal(w) {
  answered = true;
  document.querySelectorAll('.choice').forEach(b => b.disabled = true);
  const blank = document.getElementById('blank');
  blank.textContent = w.ja;
  blank.classList.add('filled');
  const box = document.getElementById('answerbox');
  box.innerHTML =
    `<div class="ja">${esc(w.ja)}</div>` +
    (w.reading ? `<div class="reading">${esc(w.reading)}</div>` : '') +
    `<div class="meaning">${w.meaning}</div>`;
  box.classList.add('show');
  document.getElementById('nextBtn').style.display = 'inline-block';
}

function next() {
  idx++;
  if (idx >= queue.length) {
    document.getElementById('doneMsg').textContent =
      `${queue.length} この言葉を、文の中で使ってみたよ。`;
    document.getElementById('overlay').classList.add('show');
    return;
  }
  render();
}

function restart() {
  document.getElementById('overlay').classList.remove('show');
  start();
}

if (allWords.length === 0) {
  document.getElementById('sentence').textContent = '今日は例文のある言葉がありません。';
  document.getElementById('progress').textContent = '';
} else {
  start();
}
</script>
</body>
</html>
