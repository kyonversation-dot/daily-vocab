<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>星の花チャレンジ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background: #1a1a2e;
    color: #eee;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 12px 16px 8px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    flex-shrink: 0;
  }

  .title-block h1 { font-size: 1.2rem; color: #ffb4d4; }
  .title-block p { font-size: 0.72rem; color: #aaa; margin-top: 2px; }

  .timer-block {
    text-align: center;
    cursor: pointer;
    user-select: none;
  }
  .timer-num {
    font-size: 2.6rem;
    font-weight: bold;
    color: #ffb4d4;
    line-height: 1;
    transition: color 0.3s;
  }
  .timer-num.danger { color: #ff6b6b; }
  .timer-num.pulse { animation: pulse 0.6s infinite alternate; }
  @keyframes pulse { from { opacity: 1; } to { opacity: 0.4; } }
  .timer-label { font-size: 0.65rem; color: #888; margin-top: 2px; }

  .instruction { font-size: 0.72rem; color: #999; margin-bottom: 8px; flex-shrink: 0; }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
    flex: 1;
    overflow: hidden;
  }

  .vocab-card {
    background: #16213e;
    border: 2px solid #2a2a5a;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 6px 4px;
    transition: background 0.2s, border-color 0.2s;
    text-align: center;
    min-height: 0;
  }
  .vocab-card:hover { border-color: #ffb4d4; }
  .vocab-card.revealed { background: #1a4731; border-color: #4caf7d; }
  .vocab-card.review { border-style: dashed; }
  .review-tag { font-size: 0.5rem; color: #f5a623; margin-bottom: 2px; }

  .word-ja { font-size: 1.05rem; font-weight: bold; color: #eee; line-height: 1.2; }
  .word-reading { font-size: 0.65rem; color: #aaa; margin-top: 2px; }
  .word-meaning { font-size: 0.72rem; color: #a8e6c1; margin-top: 5px; display: none; line-height: 1.3; }
  .vocab-card.revealed .word-meaning { display: block; }

  footer {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 8px;
    flex-shrink: 0;
  }

  button {
    padding: 8px 22px;
    border-radius: 20px;
    border: none;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
    font-weight: bold;
  }
  .btn-reveal { background: #c0436a; color: white; }
  .btn-reveal:hover { background: #e05580; }
  .btn-reset { background: #2a2a5a; color: #ccc; border: 1px solid #444; }
  .btn-reset:hover { background: #3a3a7a; }

  .note { text-align: center; font-size: 0.62rem; color: #666; margin-top: 4px; flex-shrink: 0; }

</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>📖 星の花チャレンジ</h1>
    <p>ひなののことばれんしゅう ｜ カードをタップして意味を確認！</p>
  </div>
  <div class="timer-block" onclick="toggleTimer()">
    <div class="timer-num" id="timerNum">60</div>
    <div class="timer-label" id="timerLabel">▶ タップしてスタート</div>
  </div>
</header>

<div class="instruction">💡 各カードをクリックすると意味が出るよ。タイマーが終わる前に全部確認できるかな？（黄色い点線＝復習の言葉）</div>

<div class="grid" id="grid"></div>

<footer>
  <button class="btn-reveal" onclick="revealAll()">全部見る</button>
  <button class="btn-reset" onclick="goBack()">もう一度</button>
</footer>
<div class="note">緑 = 確認済み</div>

<script>
const words = [
  {
    "ja": "まばたく",
    "reading": "まばたく",
    "meaning": "<ruby>まばたく<rt>まばたく</rt></ruby> ／ 光が、ついたり消えたりしてゆれる",
    "example": "半円球の宙に＿＿＿星みたいに光っていた。",
    "review": false
  },
  {
    "ja": "縮む",
    "reading": "ちぢむ",
    "meaning": "<ruby>縮む<rt>ちぢむ</rt></ruby> ／ 小さくなる。ちいさくかたまる",
    "example": "花びらは小さく＿＿＿で、もう色がすっかりあせている。",
    "review": false
  },
  {
    "ja": "通路",
    "reading": "つうろ",
    "meaning": "<ruby>通路<rt>つうろ</rt></ruby> ／ 人が通るための道",
    "example": "裏門にも、コンクリートの＿＿＿にも人の姿はない。",
    "review": false
  },
  {
    "ja": "日差し",
    "reading": "ひざし",
    "meaning": "<ruby>日差し<rt>ひざし</rt></ruby> ／ 照りつける日の光",
    "example": "どこも強い＿＿＿のせいで、色が飛んでしまったみたい。",
    "review": false
  },
  {
    "ja": "情景描写",
    "reading": "じょうけいびょうしゃ",
    "meaning": "<ruby>情景描写<rt>じょうけいびょうしゃ</rt></ruby> ／ 人物の心情と<ruby>響<rt>ひび</rt></ruby>き合うように<ruby>描<rt>えが</rt></ruby>かれた、風景や場面の描写",
    "example": "銀木犀の＿＿＿を、冒頭と結末で比べてみよう。",
    "review": false
  },
  {
    "ja": "解釈",
    "reading": "かいしゃく",
    "meaning": "<ruby>解釈<rt>かいしゃく</rt></ruby> ／ 読み取ったことをもとに、自分なりに考えて、新しい意味を見いだすこと",
    "example": "場面や描写を結び付けて、内容を＿＿＿しよう。",
    "review": false
  },
  {
    "ja": "冒頭",
    "reading": "ぼうとう",
    "meaning": "<ruby>冒頭<rt>ぼうとう</rt></ruby> ／ 文章のいちばん初めの部分",
    "example": "＿＿＿と結末に登場する物や場所に着目して、違いを考えるとよい。",
    "review": false
  },
  {
    "ja": "結末",
    "reading": "けつまつ",
    "meaning": "<ruby>結末<rt>けつまつ</rt></ruby> ／ 話の終わりの部分",
    "example": "冒頭と＿＿＿に登場する物や場所に着目して、違いを考えるとよい。",
    "review": false
  },
  {
    "ja": "視点",
    "reading": "してん",
    "meaning": "どこから<ruby>見<rt>み</rt></ruby>て書かれているか、という<ruby>立場<rt>たちば</rt></ruby>",
    "example": "だれの目から見て書かれているか＝＿＿＿を考えながら読む。",
    "review": true
  },
  {
    "ja": "澄む",
    "reading": "すむ",
    "meaning": "にごりがなく、きれいに<ruby>透<rt>す</rt></ruby>きとおる。「空が青く澄む」",
    "example": "川の水が＿＿＿と、底の石まで見える。",
    "review": true
  },
  {
    "ja": "一文",
    "reading": "いちぶん",
    "meaning": "「。」で終わる、ひとつの文。「この一文だけで<ruby>段落<rt>だんらく</rt></ruby>になっている」",
    "example": "「母の着物はなくなりました。」——この＿＿＿だけで、一つの段落になっている。",
    "review": true
  },
  {
    "ja": "栄養失調",
    "reading": "えいようしっちょう",
    "meaning": "食べ物が足りず、体に<ruby>必要<rt>ひつよう</rt></ruby>な<ruby>栄養<rt>えいよう</rt></ruby>がとれていない<ruby>状態<rt>じょうたい</rt></ruby>",
    "example": "病名はありません。＿＿＿です……。",
    "review": true
  }
];

const grid = document.getElementById('grid');
words.forEach(w => {
  const card = document.createElement('div');
  card.className = 'vocab-card' + (w.review ? ' review' : '');
  card.innerHTML = `
    ${w.review ? `<div class="review-tag">🔁 ふくしゅう</div>` : ''}
    <div class="word-ja">${w.ja}</div>
    ${w.reading ? `<div class="word-reading">${w.reading}</div>` : ''}
    <div class="word-meaning">${w.meaning}</div>
  `;
  card.onclick = () => card.classList.toggle('revealed');
  grid.appendChild(card);
});

let seconds = 60, running = false, timer = null;
const timerNum = document.getElementById('timerNum');
const timerLabel = document.getElementById('timerLabel');

function updateDisplay() {
  timerNum.textContent = seconds;
  const danger = seconds <= 10;
  timerNum.classList.toggle('danger', danger);
  timerNum.classList.toggle('pulse', danger && running);
  if (seconds <= 0) { timerNum.textContent = '⏰'; timerLabel.textContent = "TIME'S UP!"; }
}

function toggleTimer() {
  if (seconds <= 0) { resetTimer(); return; }
  if (running) {
    clearInterval(timer); running = false;
    timerLabel.textContent = '▶ タップしてスタート';
    timerNum.classList.remove('pulse');
  } else {
    running = true;
    timerLabel.textContent = '⏸ タップして一時停止';
    timer = setInterval(() => {
      seconds--;
      updateDisplay();
      if (seconds <= 0) { clearInterval(timer); running = false; }
    }, 1000);
  }
}

function resetTimer() {
  clearInterval(timer); running = false; seconds = 60;
  timerNum.classList.remove('danger', 'pulse');
  timerLabel.textContent = '▶ タップしてスタート';
  updateDisplay();
}

function revealAll() {
  document.querySelectorAll('.vocab-card').forEach(c => c.classList.add('revealed'));
}

function goBack() {
  document.querySelectorAll('.vocab-card.revealed').forEach(c => c.classList.remove('revealed'));
  resetTimer();
}

updateDisplay();
</script>
</body>
</html>
