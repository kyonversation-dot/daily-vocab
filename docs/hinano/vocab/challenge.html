<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>弟たちにチャレンジ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background: #1a1a2e;
    color: #eee;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 12px 16px 8px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    flex-shrink: 0;
  }

  .title-block h1 { font-size: 1.2rem; color: #ffb4d4; }
  .title-block p { font-size: 0.72rem; color: #aaa; margin-top: 2px; }

  .timer-block {
    text-align: center;
    cursor: pointer;
    user-select: none;
  }
  .timer-num {
    font-size: 2.6rem;
    font-weight: bold;
    color: #ffb4d4;
    line-height: 1;
    transition: color 0.3s;
  }
  .timer-num.danger { color: #ff6b6b; }
  .timer-num.pulse { animation: pulse 0.6s infinite alternate; }
  @keyframes pulse { from { opacity: 1; } to { opacity: 0.4; } }
  .timer-label { font-size: 0.65rem; color: #888; margin-top: 2px; }

  .instruction { font-size: 0.72rem; color: #999; margin-bottom: 8px; flex-shrink: 0; }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
    flex: 1;
    overflow: hidden;
  }

  .vocab-card {
    background: #16213e;
    border: 2px solid #2a2a5a;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 6px 4px;
    transition: background 0.2s, border-color 0.2s;
    text-align: center;
    min-height: 0;
  }
  .vocab-card:hover { border-color: #ffb4d4; }
  .vocab-card.revealed { background: #1a4731; border-color: #4caf7d; }
  .vocab-card.review { border-style: dashed; }
  .review-tag { font-size: 0.5rem; color: #f5a623; margin-bottom: 2px; }

  .word-ja { font-size: 1.05rem; font-weight: bold; color: #eee; line-height: 1.2; }
  .word-reading { font-size: 0.65rem; color: #aaa; margin-top: 2px; }
  .word-meaning { font-size: 0.72rem; color: #a8e6c1; margin-top: 5px; display: none; line-height: 1.3; }
  .vocab-card.revealed .word-meaning { display: block; }

  footer {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 8px;
    flex-shrink: 0;
  }

  button {
    padding: 8px 22px;
    border-radius: 20px;
    border: none;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
    font-weight: bold;
  }
  .btn-reveal { background: #c0436a; color: white; }
  .btn-reveal:hover { background: #e05580; }
  .btn-reset { background: #2a2a5a; color: #ccc; border: 1px solid #444; }
  .btn-reset:hover { background: #3a3a7a; }

  .note { text-align: center; font-size: 0.62rem; color: #666; margin-top: 4px; flex-shrink: 0; }

</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>📖 弟たちにチャレンジ</h1>
    <p>ひなののことばれんしゅう ｜ カードをタップして意味を確認！</p>
  </div>
  <div class="timer-block" onclick="toggleTimer()">
    <div class="timer-num" id="timerNum">60</div>
    <div class="timer-label" id="timerLabel">▶ タップしてスタート</div>
  </div>
</header>

<div class="instruction">💡 各カードをクリックすると意味が出るよ。タイマーが終わる前に全部確認できるかな？（黄色い点線＝復習の言葉）</div>

<div class="grid" id="grid"></div>

<footer>
  <button class="btn-reveal" onclick="revealAll()">全部見る</button>
  <button class="btn-reset" onclick="goBack()">もう一度</button>
</footer>
<div class="note">緑 = 確認済み</div>

<script>
const words = [
  {
    "ja": "題名",
    "reading": "だいめい",
    "meaning": "<ruby>作品<rt>さくひん</rt></ruby>につけられた名前",
    "example": "「大人になれなかった弟たちに……」という＿＿＿の意味を話し合おう。",
    "review": false
  },
  {
    "ja": "片仮名",
    "reading": "かたかな",
    "meaning": "カタカナ。「ヒロユキ」「ヒロシマ」のような書き方",
    "example": "「ヒロユキ」「ヒロシマ」「ナガサキ」が＿＿＿で書かれている意味を考えよう。",
    "review": false
  },
  {
    "ja": "表記",
    "reading": "ひょうき",
    "meaning": "文字での<ruby>書<rt>か</rt></ruby>き<ruby>表<rt>あらわ</rt></ruby>し方。「片仮名表記」",
    "example": "人の名前や地名を片仮名で書く——この＿＿＿にはどんな効果があるだろう。",
    "review": false
  },
  {
    "ja": "効果",
    "reading": "こうか",
    "meaning": "そう書いたことで生まれる、読む人への<ruby>働<rt>はたら</rt></ruby>き",
    "example": "短く言い切ると、どんな＿＿＿があるだろう。",
    "review": false
  },
  {
    "ja": "印象",
    "reading": "いんしょう",
    "meaning": "読んだり見たりして、心に<ruby>残<rt>のこ</rt></ruby>る感じ",
    "example": "「一本道」と書くのと「白い乾いた一本道」と書くのでは、受ける＿＿＿がちがう。",
    "review": false
  },
  {
    "ja": "語り手",
    "reading": "かたりて",
    "meaning": "<ruby>物語<rt>ものがたり</rt></ruby>を<ruby>語<rt>かた</rt></ruby>っている人。この作品では「僕」",
    "example": "この物語の＿＿＿は、大人になった「僕」である。",
    "review": false
  },
  {
    "ja": "視点",
    "reading": "してん",
    "meaning": "どこから<ruby>見<rt>み</rt></ruby>て書かれているか、という<ruby>立場<rt>たちば</rt></ruby>",
    "example": "だれの目から見て書かれているか＝＿＿＿を考えながら読む。",
    "review": false
  },
  {
    "ja": "作者",
    "reading": "さくしゃ",
    "meaning": "その<ruby>作品<rt>さくひん</rt></ruby>を書いた人",
    "example": "「大人になれなかった弟たちに……」の＿＿＿は、米倉斉加年である。",
    "review": false
  },
  {
    "ja": "空襲",
    "reading": "くうしゅう",
    "meaning": "飛行機が空から<ruby>爆弾<rt>ばくだん</rt></ruby>を落として<ruby>攻撃<rt>こうげき</rt></ruby>すること",
    "example": "あまり＿＿＿がひどくなってきたので、母は疎開しようと言いだしました。",
    "review": true
  },
  {
    "ja": "描写",
    "reading": "びょうしゃ",
    "meaning": "様子や<ruby>心情<rt>しんじょう</rt></ruby>を、<ruby>読<rt>よ</rt></ruby>み<ruby>手<rt>て</rt></ruby>が<ruby>想像<rt>そうぞう</rt></ruby>できるように<ruby>描<rt>えが</rt></ruby>くこと（この単元のキーワード）",
    "example": "心情は、行動や風景の＿＿＿にたくして表されることが多い。",
    "review": true
  },
  {
    "ja": "疎開",
    "reading": "そかい",
    "meaning": "<ruby>空襲<rt>くうしゅう</rt></ruby>からのがれるため、<ruby>都会<rt>とかい</rt></ruby>から<ruby>地方<rt>ちほう</rt></ruby>へ引っこすこと",
    "example": "あまり空襲がひどくなってきたので、母は＿＿＿しようと言いだしました。",
    "review": true
  },
  {
    "ja": "時代背景",
    "reading": "じだいはいけい",
    "meaning": "その<ruby>話<rt>はなし</rt></ruby>がおこった時代のようす・世の中のじょうたい",
    "example": "戦争中というこの物語の＿＿＿を知ると、母の苦労がよく分かる。",
    "review": true
  }
];

const grid = document.getElementById('grid');
words.forEach(w => {
  const card = document.createElement('div');
  card.className = 'vocab-card' + (w.review ? ' review' : '');
  card.innerHTML = `
    ${w.review ? `<div class="review-tag">🔁 ふくしゅう</div>` : ''}
    <div class="word-ja">${w.ja}</div>
    ${w.reading ? `<div class="word-reading">${w.reading}</div>` : ''}
    <div class="word-meaning">${w.meaning}</div>
  `;
  card.onclick = () => card.classList.toggle('revealed');
  grid.appendChild(card);
});

let seconds = 60, running = false, timer = null;
const timerNum = document.getElementById('timerNum');
const timerLabel = document.getElementById('timerLabel');

function updateDisplay() {
  timerNum.textContent = seconds;
  const danger = seconds <= 10;
  timerNum.classList.toggle('danger', danger);
  timerNum.classList.toggle('pulse', danger && running);
  if (seconds <= 0) { timerNum.textContent = '⏰'; timerLabel.textContent = "TIME'S UP!"; }
}

function toggleTimer() {
  if (seconds <= 0) { resetTimer(); return; }
  if (running) {
    clearInterval(timer); running = false;
    timerLabel.textContent = '▶ タップしてスタート';
    timerNum.classList.remove('pulse');
  } else {
    running = true;
    timerLabel.textContent = '⏸ タップして一時停止';
    timer = setInterval(() => {
      seconds--;
      updateDisplay();
      if (seconds <= 0) { clearInterval(timer); running = false; }
    }, 1000);
  }
}

function resetTimer() {
  clearInterval(timer); running = false; seconds = 60;
  timerNum.classList.remove('danger', 'pulse');
  timerLabel.textContent = '▶ タップしてスタート';
  updateDisplay();
}

function revealAll() {
  document.querySelectorAll('.vocab-card').forEach(c => c.classList.add('revealed'));
}

function goBack() {
  document.querySelectorAll('.vocab-card.revealed').forEach(c => c.classList.remove('revealed'));
  resetTimer();
}

updateDisplay();
</script>
</body>
</html>
