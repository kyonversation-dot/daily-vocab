<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>星の花チャレンジ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background: #1a1a2e;
    color: #eee;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 12px 16px 8px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    flex-shrink: 0;
  }

  .title-block h1 { font-size: 1.2rem; color: #ffb4d4; }
  .title-block p { font-size: 0.72rem; color: #aaa; margin-top: 2px; }

  .timer-block {
    text-align: center;
    cursor: pointer;
    user-select: none;
  }
  .timer-num {
    font-size: 2.6rem;
    font-weight: bold;
    color: #ffb4d4;
    line-height: 1;
    transition: color 0.3s;
  }
  .timer-num.danger { color: #ff6b6b; }
  .timer-num.pulse { animation: pulse 0.6s infinite alternate; }
  @keyframes pulse { from { opacity: 1; } to { opacity: 0.4; } }
  .timer-label { font-size: 0.65rem; color: #888; margin-top: 2px; }

  .instruction { font-size: 0.72rem; color: #999; margin-bottom: 8px; flex-shrink: 0; }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
    flex: 1;
    overflow: hidden;
  }

  .vocab-card {
    background: #16213e;
    border: 2px solid #2a2a5a;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 6px 4px;
    transition: background 0.2s, border-color 0.2s;
    text-align: center;
    min-height: 0;
  }
  .vocab-card:hover { border-color: #ffb4d4; }
  .vocab-card.revealed { background: #1a4731; border-color: #4caf7d; }
  .vocab-card.review { border-style: dashed; }
  .review-tag { font-size: 0.5rem; color: #f5a623; margin-bottom: 2px; }

  .word-ja { font-size: 1.05rem; font-weight: bold; color: #eee; line-height: 1.2; }
  .word-reading { font-size: 0.65rem; color: #aaa; margin-top: 2px; }
  .word-meaning { font-size: 0.72rem; color: #a8e6c1; margin-top: 5px; display: none; line-height: 1.3; }
  .vocab-card.revealed .word-meaning { display: block; }

  footer {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 8px;
    flex-shrink: 0;
  }

  button {
    padding: 8px 22px;
    border-radius: 20px;
    border: none;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
    font-weight: bold;
  }
  .btn-reveal { background: #c0436a; color: white; }
  .btn-reveal:hover { background: #e05580; }
  .btn-reset { background: #2a2a5a; color: #ccc; border: 1px solid #444; }
  .btn-reset:hover { background: #3a3a7a; }

  .note { text-align: center; font-size: 0.62rem; color: #666; margin-top: 4px; flex-shrink: 0; }

</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>📖 星の花チャレンジ</h1>
    <p>ひなののことばれんしゅう ｜ カードをタップして意味を確認！</p>
  </div>
  <div class="timer-block" onclick="toggleTimer()">
    <div class="timer-num" id="timerNum">60</div>
    <div class="timer-label" id="timerLabel">▶ タップしてスタート</div>
  </div>
</header>

<div class="instruction">💡 各カードをクリックすると意味が出るよ。タイマーが終わる前に全部確認できるかな？（黄色い点線＝復習の言葉）</div>

<div class="grid" id="grid"></div>

<footer>
  <button class="btn-reveal" onclick="revealAll()">全部見る</button>
  <button class="btn-reset" onclick="goBack()">もう一度</button>
</footer>
<div class="note">緑 = 確認済み</div>

<script>
const words = [
  {
    "ja": "疎開者",
    "reading": "そかいしゃ",
    "meaning": "空襲をさけて都会から引っこしてきた人。「僕たち疎開者には<ruby>配給<rt>はいきゅう</rt></ruby>もありませんので」",
    "example": "僕たち＿＿＿には配給もありませんので、母は着物を米と交換してもらっていました。",
    "review": true
  },
  {
    "ja": "山あい",
    "reading": "やまあい",
    "meaning": "山と山の<ruby>間<rt>あいだ</rt></ruby>のところ",
    "example": "福岡から南へ二十キロくらい行った、石釜という＿＿＿の村です。",
    "review": true
  },
  {
    "ja": "想像",
    "reading": "そうぞう",
    "meaning": "<ruby>実際<rt>じっさい</rt></ruby>に見ていないことを、<ruby>頭<rt>あたま</rt></ruby>の中に思いうかべること",
    "example": "読み手が＿＿＿できるように描いたものを、描写という。",
    "review": true
  },
  {
    "ja": "棺",
    "reading": "ひつぎ",
    "meaning": "なくなった人を<ruby>納<rt>おさ</rt></ruby>める<ruby>箱<rt>はこ</rt></ruby>",
    "example": "農家のおじいさんが、杉板を削って小さな小さな＿＿＿を作ってくださいました。",
    "review": true
  },
  {
    "ja": "根拠",
    "reading": "こんきょ",
    "meaning": "そう考えたもとになる<ruby>事実<rt>じじつ</rt></ruby>。「本文のどこが根拠ですか」",
    "example": "自分の考えを言うときは、本文のどこが＿＿＿かも一緒に言う。",
    "review": true
  },
  {
    "ja": "隣村",
    "reading": "となりむら",
    "meaning": "となりの村。「隣村にやぎを<ruby>飼<rt>か</rt></ruby>っている農家があると聞いては」",
    "example": "＿＿＿にやぎを飼っている農家があると聞いては、母が出かけました。",
    "review": true
  },
  {
    "ja": "配給",
    "reading": "はいきゅう",
    "meaning": "<ruby>不足<rt>ふそく</rt></ruby>した物を、政府が<ruby>決<rt>き</rt></ruby>まった量ずつ配ること（戦争中のしくみ）",
    "example": "僕たち疎開者には＿＿＿もありませんので、母は着物を米と交換していました。",
    "review": true
  },
  {
    "ja": "意外",
    "reading": "いがい",
    "meaning": "<ruby>意外<rt>いがい</rt></ruby> ／ 思っていたのとちがうこと",
    "example": "おまえは俺を＿＿＿とハンサムだと思ったことが——。",
    "review": true
  },
  {
    "ja": "たくす",
    "reading": "たくす",
    "meaning": "<ruby>直接<rt>ちょくせつ</rt></ruby>言わずに、べつのものに気持ちをこめる。「<ruby>心情<rt>しんじょう</rt></ruby>を<ruby>描写<rt>びょうしゃ</rt></ruby>にたくす」",
    "example": "作者は母の気持ちを、行動の描写に＿＿＿。",
    "review": true
  },
  {
    "ja": "朗読",
    "reading": "ろうどく",
    "meaning": "気持ちが<ruby>伝<rt>つた</rt></ruby>わるように、声に出して読むこと",
    "example": "心に残った場面を＿＿＿し、感想を伝え合おう。",
    "review": true
  },
  {
    "ja": "語り手",
    "reading": "かたりて",
    "meaning": "<ruby>物語<rt>ものがたり</rt></ruby>を<ruby>語<rt>かた</rt></ruby>っている人。この作品では「僕」",
    "example": "この物語の＿＿＿は、大人になった「僕」である。",
    "review": true
  },
  {
    "ja": "澄む",
    "reading": "すむ",
    "meaning": "にごりがなく、きれいに<ruby>透<rt>す</rt></ruby>きとおる。「空が青く澄む」",
    "example": "川の水が＿＿＿と、底の石まで見える。",
    "review": true
  }
];

const grid = document.getElementById('grid');
words.forEach(w => {
  const card = document.createElement('div');
  card.className = 'vocab-card' + (w.review ? ' review' : '');
  card.innerHTML = `
    ${w.review ? `<div class="review-tag">🔁 ふくしゅう</div>` : ''}
    <div class="word-ja">${w.ja}</div>
    ${w.reading ? `<div class="word-reading">${w.reading}</div>` : ''}
    <div class="word-meaning">${w.meaning}</div>
  `;
  card.onclick = () => card.classList.toggle('revealed');
  grid.appendChild(card);
});

let seconds = 60, running = false, timer = null;
const timerNum = document.getElementById('timerNum');
const timerLabel = document.getElementById('timerLabel');

function updateDisplay() {
  timerNum.textContent = seconds;
  const danger = seconds <= 10;
  timerNum.classList.toggle('danger', danger);
  timerNum.classList.toggle('pulse', danger && running);
  if (seconds <= 0) { timerNum.textContent = '⏰'; timerLabel.textContent = "TIME'S UP!"; }
}

function toggleTimer() {
  if (seconds <= 0) { resetTimer(); return; }
  if (running) {
    clearInterval(timer); running = false;
    timerLabel.textContent = '▶ タップしてスタート';
    timerNum.classList.remove('pulse');
  } else {
    running = true;
    timerLabel.textContent = '⏸ タップして一時停止';
    timer = setInterval(() => {
      seconds--;
      updateDisplay();
      if (seconds <= 0) { clearInterval(timer); running = false; }
    }, 1000);
  }
}

function resetTimer() {
  clearInterval(timer); running = false; seconds = 60;
  timerNum.classList.remove('danger', 'pulse');
  timerLabel.textContent = '▶ タップしてスタート';
  updateDisplay();
}

function revealAll() {
  document.querySelectorAll('.vocab-card').forEach(c => c.classList.add('revealed'));
}

function goBack() {
  document.querySelectorAll('.vocab-card.revealed').forEach(c => c.classList.remove('revealed'));
  resetTimer();
}

updateDisplay();
</script>
</body>
</html>
