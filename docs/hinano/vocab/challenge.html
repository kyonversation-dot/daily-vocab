<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弟たちにチャレンジ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background: #1a1a2e;
    color: #eee;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 12px 16px 8px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    flex-shrink: 0;
  }

  .title-block h1 { font-size: 1.2rem; color: #ffb4d4; }
  .title-block p { font-size: 0.72rem; color: #aaa; margin-top: 2px; }

  .timer-block {
    text-align: center;
    cursor: pointer;
    user-select: none;
  }
  .timer-num {
    font-size: 2.6rem;
    font-weight: bold;
    color: #ffb4d4;
    line-height: 1;
    transition: color 0.3s;
  }
  .timer-num.danger { color: #ff6b6b; }
  .timer-num.pulse { animation: pulse 0.6s infinite alternate; }
  @keyframes pulse { from { opacity: 1; } to { opacity: 0.4; } }
  .timer-label { font-size: 0.65rem; color: #888; margin-top: 2px; }

  .instruction { font-size: 0.72rem; color: #999; margin-bottom: 8px; flex-shrink: 0; }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
    flex: 1;
    overflow: hidden;
  }

  .vocab-card {
    background: #16213e;
    border: 2px solid #2a2a5a;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 6px 4px;
    transition: background 0.2s, border-color 0.2s;
    text-align: center;
    min-height: 0;
  }
  .vocab-card:hover { border-color: #ffb4d4; }
  .vocab-card.revealed { background: #1a4731; border-color: #4caf7d; }
  .vocab-card.review { border-style: dashed; }
  .review-tag { font-size: 0.5rem; color: #f5a623; margin-bottom: 2px; }

  .word-ja { font-size: 1.05rem; font-weight: bold; color: #eee; line-height: 1.2; }
  .word-reading { font-size: 0.65rem; color: #aaa; margin-top: 2px; }
  .word-meaning { font-size: 0.72rem; color: #a8e6c1; margin-top: 5px; display: none; line-height: 1.3; }
  .vocab-card.revealed .word-meaning { display: block; }

  footer {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 8px;
    flex-shrink: 0;
  }

  button {
    padding: 8px 22px;
    border-radius: 20px;
    border: none;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
    font-weight: bold;
  }
  .btn-reveal { background: #c0436a; color: white; }
  .btn-reveal:hover { background: #e05580; }
  .btn-reset { background: #2a2a5a; color: #ccc; border: 1px solid #444; }
  .btn-reset:hover { background: #3a3a7a; }

  .note { text-align: center; font-size: 0.62rem; color: #666; margin-top: 4px; flex-shrink: 0; }

</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>📖 弟たちにチャレンジ</h1>
    <p>ひなののことばれんしゅう ｜ カードをタップして意味を確認！</p>
  </div>
  <div class="timer-block" onclick="toggleTimer()">
    <div class="timer-num" id="timerNum">60</div>
    <div class="timer-label" id="timerLabel">▶ タップしてスタート</div>
  </div>
</header>

<div class="instruction">💡 各カードをクリックすると意味が出るよ。タイマーが終わる前に全部確認できるかな？（黄色い点線＝復習の言葉）</div>

<div class="grid" id="grid"></div>

<footer>
  <button class="btn-reveal" onclick="revealAll()">全部見る</button>
  <button class="btn-reset" onclick="goBack()">もう一度</button>
</footer>
<div class="note">緑 = 確認済み</div>

<script>
const words = [
  {
    "ja": "息をひきとる",
    "reading": "いきをひきとる",
    "meaning": "<ruby>死<rt>し</rt></ruby>ぬ、のしずかな言い方",
    "example": "母と僕に見守られて、弟は静かに＿＿＿。",
    "review": false
  },
  {
    "ja": "たくす",
    "reading": "たくす",
    "meaning": "<ruby>直接<rt>ちょくせつ</rt></ruby>言わずに、べつのものに気持ちをこめる。「<ruby>心情<rt>しんじょう</rt></ruby>を<ruby>描写<rt>びょうしゃ</rt></ruby>にたくす」",
    "example": "作者は母の気持ちを、行動の描写に＿＿＿。",
    "review": false
  },
  {
    "ja": "着目",
    "reading": "ちゃくもく",
    "meaning": "そこに<ruby>目<rt>め</rt></ruby>をつけて、よく<ruby>見<rt>み</rt></ruby>ること。「<ruby>描写<rt>びょうしゃ</rt></ruby>に着目する」",
    "example": "描写に＿＿＿して読み深め、登場人物の思いが伝わるように朗読しよう。",
    "review": false
  },
  {
    "ja": "対比",
    "reading": "たいひ",
    "meaning": "二つをならべて、ちがいをきわだたせること",
    "example": "「一本道」と「白い乾いた一本道」を＿＿＿すると、受ける印象がちがう。",
    "review": false
  },
  {
    "ja": "直接",
    "reading": "ちょくせつ",
    "meaning": "あいだに何もはさまないで。「気持ちを直接<ruby>説明<rt>せつめい</rt></ruby>しない」",
    "example": "心情は、心の中を＿＿＿説明しなくても、行動や風景の描写から伝わる。",
    "review": false
  },
  {
    "ja": "想像",
    "reading": "そうぞう",
    "meaning": "<ruby>実際<rt>じっさい</rt></ruby>に見ていないことを、<ruby>頭<rt>あたま</rt></ruby>の中に思いうかべること",
    "example": "読み手が＿＿＿できるように描いたものを、描写という。",
    "review": false
  },
  {
    "ja": "変化",
    "reading": "へんか",
    "meaning": "前とちがうようすに<ruby>変<rt>か</rt></ruby>わること。「<ruby>心情<rt>しんじょう</rt></ruby>の変化」",
    "example": "物語を読むときは、登場人物の心の＿＿＿を追いかける。",
    "review": false
  },
  {
    "ja": "〜なり",
    "reading": "〜なり",
    "meaning": "〜するとすぐに。「<ruby>着<rt>つ</rt></ruby>くなり」＝着くとすぐに（<ruby>教科書<rt>きょうかしょ</rt></ruby>の<ruby>語注<rt>ごちゅう</rt></ruby>）",
    "example": "「母はそれを聞く＿＿＿、くるりと後ろを向いて帰りました。」＝聞くとすぐに。",
    "review": false
  },
  {
    "ja": "おもゆ",
    "reading": "おもゆ",
    "meaning": "おかゆのもっとうすいもの。<ruby>赤<rt>あか</rt></ruby>ちゃんや<ruby>病人<rt>びょうにん</rt></ruby>が食べる",
    "example": "おかゆのもっと薄い＿＿＿を食べさせたり、やぎのミルクを飲ませたりしました。",
    "review": true
  },
  {
    "ja": "栄養失調",
    "reading": "えいようしっちょう",
    "meaning": "食べ物が足りず、体に<ruby>必要<rt>ひつよう</rt></ruby>な<ruby>栄養<rt>えいよう</rt></ruby>がとれていない<ruby>状態<rt>じょうたい</rt></ruby>",
    "example": "病名はありません。＿＿＿です……。",
    "review": true
  },
  {
    "ja": "留守番",
    "reading": "るすばん",
    "meaning": "家に<ruby>残<rt>のこ</rt></ruby>って家を<ruby>守<rt>まも</rt></ruby>ること",
    "example": "祖母と四歳の妹に＿＿＿をたのんで、田舎へ出かけました。",
    "review": true
  },
  {
    "ja": "独特",
    "reading": "どくとく",
    "meaning": "そのものだけがもっている、<ruby>特別<rt>とくべつ</rt></ruby>な<ruby>感<rt>かん</rt></ruby>じ",
    "example": "ブウーンブウーンというB29の＿＿＿のエンジンの音がして、",
    "review": true
  }
];

const grid = document.getElementById('grid');
words.forEach(w => {
  const card = document.createElement('div');
  card.className = 'vocab-card' + (w.review ? ' review' : '');
  card.innerHTML = `
    ${w.review ? `<div class="review-tag">🔁 ふくしゅう</div>` : ''}
    <div class="word-ja">${w.ja}</div>
    ${w.reading ? `<div class="word-reading">${w.reading}</div>` : ''}
    <div class="word-meaning">${w.meaning}</div>
  `;
  card.onclick = () => card.classList.toggle('revealed');
  grid.appendChild(card);
});

let seconds = 60, running = false, timer = null;
const timerNum = document.getElementById('timerNum');
const timerLabel = document.getElementById('timerLabel');

function updateDisplay() {
  timerNum.textContent = seconds;
  const danger = seconds <= 10;
  timerNum.classList.toggle('danger', danger);
  timerNum.classList.toggle('pulse', danger && running);
  if (seconds <= 0) { timerNum.textContent = '⏰'; timerLabel.textContent = "TIME'S UP!"; }
}

function toggleTimer() {
  if (seconds <= 0) { resetTimer(); return; }
  if (running) {
    clearInterval(timer); running = false;
    timerLabel.textContent = '▶ タップしてスタート';
    timerNum.classList.remove('pulse');
  } else {
    running = true;
    timerLabel.textContent = '⏸ タップして一時停止';
    timer = setInterval(() => {
      seconds--;
      updateDisplay();
      if (seconds <= 0) { clearInterval(timer); running = false; }
    }, 1000);
  }
}

function resetTimer() {
  clearInterval(timer); running = false; seconds = 60;
  timerNum.classList.remove('danger', 'pulse');
  timerLabel.textContent = '▶ タップしてスタート';
  updateDisplay();
}

function revealAll() {
  document.querySelectorAll('.vocab-card').forEach(c => c.classList.add('revealed'));
}

function goBack() {
  document.querySelectorAll('.vocab-card.revealed').forEach(c => c.classList.remove('revealed'));
  resetTimer();
}

updateDisplay();
</script>
</body>
</html>
