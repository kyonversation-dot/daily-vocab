name: daily-vocab

# 毎日 05:20（ハンガリー夏時間 CEST=UTC+2）に生成。
# 冬時間（CET=UTC+1）は現地06:20になる。気になれば cron を調整。
#
# ⚠️ 2026-07-26 変更（二号機）：もとは "0 4 * * *"（=6:00 CEST）だったが、
#   7/24=8:20 / 7/25=8:10 と毎日2時間以上遅れて動き、7/26はついに実行されなかった。
#   GitHubのcronは「予約」であって「約束」ではなく、混むと後回し・混みすぎると当日ぶんが捨てられる。
#   毎時「0分ちょうど」は世界中のジョブが集中する最悪の時刻なので、半端な分にずらして混雑を避ける。
#   ★もし実行されない日が続いたら：Actionsタブ→左の daily-vocab→「Run workflow」で手動実行できる。
#   ★pool*.json 等をpushしても即座に再生成が走る（下の push トリガー）。
on:
  schedule:
    - cron: "20 3 * * *"     # 03:20 UTC = 05:20 CEST（0分ちょうどを避ける＝混雑回避）
  workflow_dispatch:          # 手動でも実行できる（Actionsタブのボタン）
  push:
    branches: [ main ]
    paths:
      - "pool*.json"          # 単元を差し替えたら即・その日ぶんを作り直す
      - "decks.json"
      - "templates/**"
      - "generate.js"
      - "ingest.py"

permissions:
  contents: write             # seen/docs/pool/state をコミットし返すため

concurrency:
  group: daily-vocab
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存インストール（取り込み用）
        run: pip install --quiet anthropic pymupdf

      - name: 教材Docを読んで単元プールを更新（投入箱）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python ingest.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 今日のゲームを生成
        run: node generate.js

      - name: 変更をコミット（pool / seen / docs / state）
        run: |
          git config user.name "daily-vocab-bot"
          git config user.email "actions@github.com"
          git add pool*.json seen*.json ingest_state.json docs
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "daily: $(date -u +%Y-%m-%d)"
            git push
          fi
